name: Terminal client CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Terminal client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: workspace/ambrogio-cli
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check out ambrogio-model side by side
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/ambrogio-app/ambrogio-model.git"
          ref=main
          if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then ref="$BRANCH"; fi
          git clone --quiet --branch "$ref" "$url" workspace/ambrogio-model

      - name: Check out the other repositories side by side
        run: workspace/ambrogio-model/scripts/checkout-workspace workspace "$BRANCH"

      - name: Check the model of the workspace
        run: workspace/ambrogio-model/scripts/model-checks --workspace workspace

      # Corepack runs the pnpm version that package.json of each repository declares in packageManager.
      - name: Enable Corepack
        run: corepack enable

      - name: Install and build the side-by-side backend
        working-directory: workspace/ambrogio-backend
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format='ambrogio-backend %H'
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        working-directory: workspace/ambrogio-cli
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        working-directory: workspace/ambrogio-cli
        run: pnpm audit --audit-level high

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check TypeScript
        working-directory: workspace/ambrogio-cli
        run: pnpm typecheck

      - name: Run tests
        working-directory: workspace/ambrogio-cli
        run: pnpm test

      - name: Run the integration test against the side-by-side backend
        working-directory: workspace/ambrogio-cli
        run: pnpm test:backend

      - name: Build
        working-directory: workspace/ambrogio-cli
        run: pnpm build
